name: podcast
description: "Podcast - Flutter Android Podcast App with JoyPlay & Supabase Sync"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # Icons & UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17

  # Cloud Sync (Supabase Auth & Database)
  supabase_flutter: ^2.8.4

  # Robust Cross-platform Audio Engine powered by libmpv (Windows, Linux, Android, iOS, Web)
  media_kit: ^1.1.11
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_android_audio: ^1.3.8
  media_kit_libs_linux: ^1.2.1

  # Share and File Picker
  share_plus: ^10.1.4
  file_picker: ^10.3.10

  # Background Workers & Notifications
  workmanager: ^0.10.10
  flutter_local_notifications: ^18.0.1

  # Network & Downloads
  dio: ^5.8.0+1
  path_provider: ^2.1.5
  path: ^1.9.1

  # Feed Parsing & Utilities
  xml: ^6.5.0
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.5.2
  sqflite: 2.4.5
  sqflite_android: 2.4.5
  sqflite_common_ffi: ^2.4.5
  audio_service: ^0.18.19
  smtc_windows: ^1.1.0
  flutter_rust_bridge: 2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/Podcast.png"
  min_sdk_android: 21
  adaptive_icon_background: "#7C4DFF"
  adaptive_icon_foreground: "assets/icons/Podcast_foreground.png"
  web:
    generate: true
    image_path: "assets/icons/Podcast.png"
  windows:
    generate: true
    image_path: "assets/icons/Podcast.png"
    icon_size: 48
  linux:
    generate: true
    image_path: "assets/icons/Podcast.png"

fonts:
    - family: Segoe UI
      fonts:
        - asset: assets/fonts/SegoeUI-Regular.ttf
        - asset: assets/fonts/SegoeUI-Bold.ttf
          weight: 700
        - asset: assets/fonts/SegoeUI-Semilight.ttf
          weight: 300
